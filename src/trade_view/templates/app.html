<!doctype html>
<html lang="en">
  <head>
    <title>{{ title or "Trade View" }}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      (() => {
        const key = "trade-view-theme";
        const isTheme = (value) => value === "light" || value === "dark";
        const systemTheme = () => window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";

        let storedTheme = null;
        try {
          storedTheme = localStorage.getItem(key);
        } catch {
          storedTheme = null;
        }

        document.documentElement.dataset.theme = isTheme(storedTheme) ? storedTheme : systemTheme();
      })();
    </script>
    <link href="/static/styles.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.10/dist/htmx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js" defer></script>
  </head>
  <body class="min-h-screen bg-base-200 text-base-content">
    <div class="mx-auto grid min-h-screen w-full max-w-7xl gap-4 px-3 py-3 pb-8 lg:grid-cols-[15rem_minmax(0,1fr)] lg:gap-3 lg:px-6 lg:py-4 lg:pb-12">
      <aside class="hidden lg:sticky lg:top-4 lg:flex lg:h-[calc(100vh-2rem)] lg:flex-col">
        <div class="flex h-full flex-col gap-3 rounded-box border border-base-300 bg-base-100 p-4 shadow-sm">
          <a href="/" class="btn btn-ghost justify-start px-3 text-xl font-semibold">
            Trade View
          </a>
          <ul class="menu menu-md gap-1 p-0">
            {% for item in nav_items %}
              <li>
                <a
                  class="tv-nav-link {% if active_nav == item.key %}active{% endif %}"
                  href="{{ item.path }}"
                  hx-get="{{ item.partial_path }}"
                  hx-target="#main-content"
                  hx-push-url="{{ item.path }}"
                  hx-swap="innerHTML"
                >
                  <svg class="size-[1.1rem] fill-none stroke-current stroke-[1.8] [stroke-linecap:round] [stroke-linejoin:round]" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="{{ item.icon }}"></path>
                  </svg>
                  <span>{{ item.label }}</span>
                </a>
              </li>
            {% endfor %}
          </ul>
          <form method="post" action="/logout" class="mt-auto">
            <button class="btn btn-ghost w-full justify-start px-3" type="submit">
              <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <path d="m16 17 5-5-5-5"></path>
                <path d="M21 12H9"></path>
              </svg>
              <span>Log out</span>
            </button>
          </form>
        </div>
      </aside>

      <div class="min-w-0">
        <div class="navbar mb-4 rounded-box border border-base-300 bg-base-100 shadow-sm lg:hidden">
          <div class="flex-1">
            <a href="/" class="btn btn-ghost text-lg">Trade View</a>
          </div>
          <div class="dropdown dropdown-end">
            <button class="btn btn-square btn-ghost" tabindex="0" aria-label="Open navigation">
              <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 6h16M4 12h16M4 18h16"></path>
              </svg>
            </button>
            <ul class="menu dropdown-content z-10 mt-3 w-56 rounded-box bg-base-100 p-2 shadow">
              {% for item in nav_items %}
                <li>
                  <a href="{{ item.path }}" hx-get="{{ item.partial_path }}" hx-target="#main-content" hx-push-url="{{ item.path }}">
                    {{ item.label }}
                  </a>
                </li>
              {% endfor %}
              <li>
                <form method="post" action="/logout">
                  <button class="w-full" type="submit">Log out</button>
                </form>
              </li>
            </ul>
          </div>
        </div>

        <main id="main-content" class="min-w-0" hx-history-elt>
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>

    <script>
      const tradeViewTheme = (() => {
        const key = "trade-view-theme";
        const media = window.matchMedia("(prefers-color-scheme: dark)");
        const systemTheme = () => media.matches ? "dark" : "light";
        const currentTheme = () => document.documentElement.dataset.theme || systemTheme();
        const getStoredTheme = () => {
          try {
            return localStorage.getItem(key);
          } catch {
            return null;
          }
        };
        const setStoredTheme = (theme) => {
          try {
            localStorage.setItem(key, theme);
          } catch {
            return;
          }
        };

        const applyTheme = (theme, persist = false) => {
          document.documentElement.dataset.theme = theme;
          if (persist) {
            setStoredTheme(theme);
          }
          syncControls();
        };

        const syncControls = () => {
          const theme = currentTheme();
          document.querySelectorAll("[data-theme-toggle]").forEach((toggle) => {
            toggle.checked = theme === "dark";
          });
          document.querySelectorAll("[data-theme-label]").forEach((label) => {
            label.textContent = theme === "dark" ? "Dark" : "Light";
          });
        };

        media.addEventListener("change", () => {
          if (!getStoredTheme()) {
            applyTheme(systemTheme());
          }
        });

        document.addEventListener("change", (event) => {
          if (!event.target.matches("[data-theme-toggle]")) return;
          applyTheme(event.target.checked ? "dark" : "light", true);
        });

        document.body.addEventListener("htmx:afterSwap", syncControls);
        document.addEventListener("DOMContentLoaded", syncControls);

        return { syncControls };
      })();

      const tradeViewCharts = (() => {
        const moneyFormatter = new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: "USD",
          maximumFractionDigits: 2,
        });
        const percentFormatter = new Intl.NumberFormat("en-US", {
          maximumFractionDigits: 2,
          minimumFractionDigits: 2,
          signDisplay: "always",
        });

        const themeColors = () => {
          const isDark = document.documentElement.dataset.theme === "dark";
          return {
            axis: isDark ? "rgba(229, 231, 235, 0.58)" : "rgba(31, 41, 55, 0.58)",
            grid: isDark ? "rgba(229, 231, 235, 0.12)" : "rgba(31, 41, 55, 0.12)",
            tooltipBackground: isDark ? "rgba(17, 24, 39, 0.96)" : "rgba(255, 255, 255, 0.98)",
            tooltipText: isDark ? "#f9fafb" : "#111827",
          };
        };

        const parseJson = (node, fallback) => {
          if (!node) return fallback;

          try {
            return JSON.parse(node.textContent || "");
          } catch {
            return fallback;
          }
        };

        const parseChartData = (chartNode) => {
          const container = chartNode.parentElement;
          const balanceData = parseJson(
            container?.querySelector("[data-account-balance-chart-data]"),
            [],
          );
          const performanceData = parseJson(
            container?.querySelector("[data-account-performance-chart-data]"),
            [],
          );
          const meta = parseJson(container?.querySelector("[data-account-chart-meta]"), {});

          return {
            balance: Array.isArray(balanceData) ? balanceData : [],
            performance: Array.isArray(performanceData) ? performanceData : [],
            benchmarkSymbol: meta.benchmark_symbol || "SPY",
          };
        };

        const formatPercent = (value) => `${percentFormatter.format(Number(value || 0))}%`;

        const setModeButtons = (container, mode) => {
          container?.querySelectorAll("[data-chart-mode]").forEach((button) => {
            const active = button.dataset.chartMode === mode;
            button.classList.toggle("btn-primary", active);
            button.classList.toggle("btn-outline", !active);
          });
        };

        const renderChart = (chartNode) => {
          const chartData = parseChartData(chartNode);
          if (!chartData.balance.length) return;

          const requestedMode = chartNode.dataset.chartMode || "balance";
          const mode = requestedMode === "performance" && chartData.performance.length ? "performance" : "balance";
          chartNode.dataset.chartMode = mode;
          setModeButtons(chartNode.closest(".card"), mode);

          const colors = themeColors();
          const chart = window.echarts.getInstanceByDom(chartNode) || window.echarts.init(chartNode);

          if (mode === "performance") {
            const dates = chartData.performance.map((point) => String(point.date || ""));
            chart.setOption({
              animationDuration: 450,
              grid: { left: 8, right: 12, top: 28, bottom: 6, containLabel: true },
              legend: {
                top: 0,
                right: 0,
                textStyle: { color: colors.axis },
              },
              tooltip: {
                trigger: "axis",
                backgroundColor: colors.tooltipBackground,
                borderColor: colors.grid,
                textStyle: { color: colors.tooltipText },
                valueFormatter: formatPercent,
              },
              xAxis: {
                type: "category",
                boundaryGap: false,
                data: dates,
                axisLine: { lineStyle: { color: colors.grid } },
                axisTick: { show: false },
                axisLabel: { color: colors.axis, hideOverlap: true },
              },
              yAxis: {
                type: "value",
                scale: true,
                axisLabel: {
                  color: colors.axis,
                  formatter: formatPercent,
                },
                splitLine: { lineStyle: { color: colors.grid } },
              },
              series: [
                {
                  name: "Account",
                  type: "line",
                  data: chartData.performance.map((point) => Number(point.account || 0)),
                  smooth: true,
                  showSymbol: chartData.performance.length <= 12,
                  symbolSize: 6,
                  lineStyle: { color: "#2563eb", width: 3 },
                  itemStyle: { color: "#2563eb" },
                },
                {
                  name: chartData.benchmarkSymbol,
                  type: "line",
                  data: chartData.performance.map((point) => Number(point.benchmark || 0)),
                  smooth: true,
                  showSymbol: chartData.performance.length <= 12,
                  symbolSize: 6,
                  lineStyle: { color: "#f59e0b", width: 3 },
                  itemStyle: { color: "#f59e0b" },
                },
              ],
            }, true);
            return;
          }

          const values = chartData.balance.map((point) => Number(point.value || 0));
          const dates = chartData.balance.map((point) => String(point.date || ""));
          const isPositive = values[values.length - 1] >= values[0];
          const lineColor = isPositive ? "#16a34a" : "#dc2626";
          chart.setOption({
            animationDuration: 450,
            grid: { left: 8, right: 12, top: 16, bottom: 6, containLabel: true },
            legend: { show: false },
            tooltip: {
              trigger: "axis",
              backgroundColor: colors.tooltipBackground,
              borderColor: colors.grid,
              textStyle: { color: colors.tooltipText },
              valueFormatter: (value) => moneyFormatter.format(Number(value || 0)),
            },
            xAxis: {
              type: "category",
              boundaryGap: false,
              data: dates,
              axisLine: { lineStyle: { color: colors.grid } },
              axisTick: { show: false },
              axisLabel: { color: colors.axis, hideOverlap: true },
            },
            yAxis: {
              type: "value",
              scale: true,
              axisLabel: {
                color: colors.axis,
                formatter: (value) => moneyFormatter.format(Number(value || 0)),
              },
              splitLine: { lineStyle: { color: colors.grid } },
            },
            series: [
              {
                name: "Balance",
                type: "line",
                data: values,
                smooth: true,
                showSymbol: chartData.balance.length <= 12,
                symbolSize: 6,
                lineStyle: { color: lineColor, width: 3 },
                itemStyle: { color: lineColor },
                areaStyle: { color: `${lineColor}1f` },
              },
            ],
          }, true);
        };

        const renderCandleChart = (chartNode) => {
          const container = chartNode.parentElement;
          const chartData = parseJson(
            container?.querySelector("[data-position-candle-chart-data]"),
            [],
          );
          if (!Array.isArray(chartData) || !chartData.length) return;
          const meta = parseJson(container?.querySelector("[data-position-candle-chart-meta]"), {});

          const colors = themeColors();
          const chart = window.echarts.getInstanceByDom(chartNode) || window.echarts.init(chartNode);
          const dates = chartData.map((point) => String(point.date || ""));
          const candleValues = chartData.map((point) => [
            Number(point.open || 0),
            Number(point.close || 0),
            Number(point.low || 0),
            Number(point.high || 0),
          ]);
          const volumes = chartData.map((point) => Number(point.volume || 0));
          const entryPrice = Number(meta.entry_price);
          const hasEntryPrice = Number.isFinite(entryPrice) && entryPrice > 0;
          const entryMarkerDate = dates.includes(meta.entry_marker_date) ? meta.entry_marker_date : null;
          const entryLabel = meta.entry_price_display ? `Entry ${meta.entry_price_display}` : "Entry";
          const entryLine = hasEntryPrice ? {
            silent: false,
            symbol: "none",
            label: {
              show: false,
              formatter: entryLabel,
            },
            lineStyle: {
              color: "#6366f1",
              width: 1.5,
              type: "dashed",
            },
            tooltip: {
              formatter: () => `${entryLabel}<br>${meta.entry_date || ""}`,
            },
            data: [{ name: entryLabel, yAxis: entryPrice }],
          } : undefined;
          const entryMarkerSeries = hasEntryPrice && entryMarkerDate ? [{
            name: "Entry",
            type: "scatter",
            data: [[entryMarkerDate, entryPrice]],
            symbol: "circle",
            symbolSize: 6,
            itemStyle: {
              color: "#6366f1",
              borderColor: colors.tooltipText,
              borderWidth: 1,
            },
            tooltip: {
              formatter: () => `${entryLabel}<br>${entryMarkerDate}`,
            },
            z: 5,
          }] : [];

          chart.setOption({
            animationDuration: 450,
            grid: [
              { left: 8, right: 12, top: 16, height: "68%", containLabel: true },
              { left: 8, right: 12, top: "78%", height: "14%", containLabel: true },
            ],
            tooltip: {
              trigger: "axis",
              axisPointer: { type: "cross" },
              backgroundColor: colors.tooltipBackground,
              borderColor: colors.grid,
              textStyle: { color: colors.tooltipText },
            },
            xAxis: [
              {
                type: "category",
                data: dates,
                boundaryGap: true,
                axisLine: { lineStyle: { color: colors.grid } },
                axisTick: { show: false },
                axisLabel: { color: colors.axis, hideOverlap: true },
              },
              {
                type: "category",
                data: dates,
                gridIndex: 1,
                boundaryGap: true,
                axisLine: { lineStyle: { color: colors.grid } },
                axisTick: { show: false },
                axisLabel: { show: false },
              },
            ],
            yAxis: [
              {
                scale: true,
                position: "right",
                axisLabel: {
                  color: colors.axis,
                  formatter: (value) => moneyFormatter.format(Number(value || 0)),
                },
                splitLine: { lineStyle: { color: colors.grid } },
              },
              {
                scale: true,
                gridIndex: 1,
                axisLabel: { show: false },
                axisLine: { show: false },
                axisTick: { show: false },
                splitLine: { show: false },
              },
            ],
            dataZoom: [
              { type: "inside", xAxisIndex: [0, 1], start: 0, end: 100 },
              { type: "slider", xAxisIndex: [0, 1], bottom: 0, height: 18, start: 0, end: 100 },
            ],
            series: [
              {
                name: "OHLC",
                type: "candlestick",
                data: candleValues,
                itemStyle: {
                  color: "#16a34a",
                  color0: "#dc2626",
                  borderColor: "#16a34a",
                  borderColor0: "#dc2626",
                },
                markLine: entryLine,
              },
              {
                name: "Volume",
                type: "bar",
                xAxisIndex: 1,
                yAxisIndex: 1,
                data: volumes,
                itemStyle: { color: "rgba(107, 114, 128, 0.45)" },
              },
              ...entryMarkerSeries,
            ],
          }, true);
        };

        const init = (root = document) => {
          if (!window.echarts) return;

          root.querySelectorAll("[data-account-balance-chart]").forEach((chartNode) => {
            renderChart(chartNode);

            if (!chartNode.dataset.resizeBound) {
              const chart = window.echarts.getInstanceByDom(chartNode);
              chartNode.closest(".card")?.querySelectorAll("[data-chart-mode]").forEach((button) => {
                button.addEventListener("click", () => {
                  chartNode.dataset.chartMode = button.dataset.chartMode || "balance";
                  renderChart(chartNode);
                });
              });
              window.addEventListener("resize", () => chart?.resize());
              chartNode.dataset.resizeBound = "true";
            }
          });

          root.querySelectorAll("[data-position-candle-chart]").forEach((chartNode) => {
            renderCandleChart(chartNode);

            if (!chartNode.dataset.resizeBound) {
              const chart = window.echarts.getInstanceByDom(chartNode);
              window.addEventListener("resize", () => chart?.resize());
              chartNode.dataset.resizeBound = "true";
            }
          });
        };

        return { init };
      })();

      document.body.addEventListener("htmx:beforeRequest", (event) => {
        const item = event.target.closest(".tv-nav-link");
        if (!item) return;
        document.querySelectorAll(".tv-nav-link").forEach((node) => node.classList.remove("active"));
        item.classList.add("active");
      });

      document.body.addEventListener("htmx:afterSwap", (event) => {
        tradeViewTheme.syncControls();
        tradeViewCharts.init(event.detail.target);
      });
      document.addEventListener("DOMContentLoaded", () => tradeViewCharts.init());
      document.addEventListener("change", (event) => {
        if (!event.target.matches("[data-theme-toggle]")) return;
        requestAnimationFrame(() => tradeViewCharts.init());
      });
    </script>
  </body>
</html>
